name: SBT Web deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore rich SBT UI for deployment
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'class="app"' web/index.html; then
            git show 33b3617c40b5c95d0036a99ce705853010fc5e68:web/index.html > web/index.html
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('web/index.html')
          s = p.read_text(encoding='utf-8')
          loader = '<script src="/runtime.js?v=20261007mt4telemetryfix2" defer></script>\n'
          versions = [
              '<script src="/runtime.js" defer></script>\n',
              '<script src="/runtime.js?v=20260910" defer></script>\n',
              '<script src="/runtime.js?v=20260911" defer></script>\n',
              '<script src="/runtime.js?v=20260912" defer></script>\n',
              '<script src="/runtime.js?v=20260915" defer></script>\n',
          ]
          for old in versions[:-1]:
              if old in s:
                  s = s.replace(old, loader, 1)
                  break
          if '/runtime.js?v=20261006mt4frontendfix1' not in s:
              s = s.replace('</body>', loader + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          API_URL=https://bitey-system-bots-trading-api.onrender.com
          api_get(){ curl -fsSL --retry 5 --retry-delay 2 -H 'Accept: application/json' "$API_URL$1"; }
          api_post(){ curl -fsSL --retry 5 --retry-delay 2 -H 'Accept: application/json' -H 'Content-Type: application/json' -X POST --data "$2" "$API_URL$1"; }
          api_get '/api/v1/bot-profiles' > /tmp/profiles.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/profiles.json'))
          assert isinstance(d,list) and d, 'bot-profiles contract failed'
          print('Bot Observer backend contract OK:', len(d), 'profiles')
          PY
          api_get '/api/v1/market/quote/EURUSD' > /tmp/quote.json
          api_get '/api/v1/market/candles/EURUSD?timeframe=H1&limit=120' > /tmp/candles.json
          CANDLES=/tmp/candles.json python - <<'PY'
          import json, os
          d=json.load(open(os.environ['CANDLES']))
          assert d.get('ok') is True and len(d.get('candles') or []) >= 35, 'market contract failed'
          print('Market Intelligence contract OK:', len(d['candles']), 'candles')
          PY
          python - <<'PY'\n          import json\n          d=json.load(open('/tmp/candles.json'))\n          payload={'symbol':'EURUSD','timeframe':'H1','candles':(d.get('candles') or [])[:80],'capital':500,'language':'es','event':'deploy_smoke'}\n          json.dump(payload,open('/tmp/analyze_payload.json','w'))\n          PY\n          api_post '/api/v1/sbt/market-intelligence/analyze' "$(cat /tmp/analyze_payload.json)" >/tmp/analyze.json\n          python - <<'PY'\n          import json\n          d=json.load(open('/tmp/analyze.json'))\n          assert isinstance(d,dict), 'market intelligence analyze returned invalid JSON'\n          print('Market Intelligence analyze OK')\n          PY\n          api_post '/api/v1/capabilities/delegate' '{"contract":"sbt-v1","capability":"sbt","message":"deploy smoke test","source":"github-actions","mode":"research-only"}' >/tmp/research.json
          api_get '/api/v1/validation/virtual' >/tmp/validation.json
          api_post '/api/v1/backtest' '{"prices":[1,1.001,1.002,1.001,1.003,1.004,1.002,1.005,1.006,1.004,1.007,1.008,1.006,1.009,1.010,1.008,1.011,1.012,1.010,1.013,1.014,1.012,1.015,1.016,1.014,1.017,1.018,1.016,1.019,1.020,1.018,1.021,1.022,1.020,1.023,1.024,1.022,1.025,1.026,1.024,1.027,1.028,1.026,1.029,1.030,1.028,1.031,1.032,1.030,1.033,1.034,1.032,1.035,1.036,1.034,1.037,1.038,1.036,1.039,1.040],"initial_capital":10000,"fast_window":8,"slow_window":21,"fee_pct":0.001}' >/tmp/backtest.json
          echo 'Verified backend contracts: Bot Observer, Market Matrix/Intelligence, Research, Validation, Evolution/AI Bot Lab backtest.'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test deployed Worker
        env:
          SBT_URL: https://bitey-system-bots-trading.raylerr481.workers.dev
        run: |
          set -euo pipefail
          body=$(curl -fsSL --retry 5 --retry-delay 3 "$SBT_URL/?probe=$GITHUB_SHA")
          [[ "$body" == *"Bitey SBT"* ]]
          [[ "$body" == *"Trading Laboratory"* ]]
          [[ "$body" == *"Market Intelligence"* ]]
          thesis=$(curl -fsSL --retry 5 --retry-delay 3 "$SBT_URL/thesis-lab.html?probe=$GITHUB_SHA")
          [[ "$thesis" == *"Mathematical Market Thesis Lab"* ]]
          [[ "$thesis" == *"Random Walk Baseline"* ]]
          [[ "$thesis" == *"GARCH(1,1)"* ]]
          health=$(curl -fsSL --retry 5 --retry-delay 3 "$SBT_URL/health?probe=$GITHUB_SHA")
          [[ "$health" == *'"live":true'* ]]
          [[ "$health" == *'"virtual_money":true'* ]]
          [[ "$health" == *'"broker_orders":0'* ]]
          [[ "$health" == *'"web_build":"'* ]]
          candles=$(curl -fsSL --retry 5 --retry-delay 3 "$SBT_URL/api/v1/market/candles/EURUSD?timeframe=M5&limit=200&probe=$GITHUB_SHA")
          CANDLES="$candles" python - <<'PY'
          import json, os, sys
          payload = json.loads(os.environ['CANDLES'])
          candles = payload.get('candles') or []
          if payload.get('ok') is not True or len(candles) < 20:
              print('Market candle smoke test failed:', json.dumps(payload)[:2000])
              sys.exit(1)
          required = ('time', 'open', 'high', 'low', 'close')
          if not all(all(k in c for k in required) for c in candles[:20]):
              print('Market candle contract failed: missing OHLC fields')
              sys.exit(1)
          print(f'Market candle smoke test OK: {len(candles)} EURUSD M5 candles')
          PY
