name: SBT Web deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Worker source and backend contract
        shell: bash
        run: |
          set -euo pipefail
          test -s worker.js
          test -s mt4-proxy.js
          test -s web/index.html
          test -s wrangler.toml
          grep -q "handleMt4Proxy" worker.js
          grep -q "live_trading_enabled: false" worker.js
          curl -fsSL --retry 3 --retry-delay 2 \
            -H 'Accept: application/json' \
            https://bitey-system-bots-trading-api.onrender.com/api/v1/mt4/active-bot \
            -o /tmp/mt4-active-bot.json
          python -c "import json; d=json.load(open('/tmp/mt4-active-bot.json')); assert 'connected' in d, d; print('MT4 backend contract OK; connected=', d['connected'])"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: |
          node --check worker.js
          node --check mt4-proxy.js

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test deployed Worker and MT4 proxy
        shell: bash
        env:
          SBT_URL: https://bitey-system-bots-trading.raylerr481.workers.dev
        run: |
          set -euo pipefail
          body=$(curl -fsSL --retry 5 --retry-delay 3 "$SBT_URL/?probe=$GITHUB_SHA")
          [[ "$body" == *"Bitey SBT"* ]]
          [[ "$body" == *"Trading Laboratory"* ]]

          health=$(curl -fsSL --retry 5 --retry-delay 3 "$SBT_URL/health?probe=$GITHUB_SHA")
          HEALTH="$health" python -c "import json,os; d=json.loads(os.environ['HEALTH']); assert d.get('status') == 'ok'; assert d.get('live') is False; assert d.get('virtual_money') is True; assert d.get('broker_orders') == 0; print('Worker safety health OK:', d.get('web_build'))"

          mt4health=$(curl -fsSL --retry 5 --retry-delay 3 "$SBT_URL/api/v1/mt4/health?probe=$GITHUB_SHA")
          MT4_HEALTH="$mt4health" python -c "import json,os; d=json.loads(os.environ['MT4_HEALTH']); assert d.get('ok') is True, d; assert 'connected' in d, d; print('MT4 proxy health OK; connected=', d['connected'])"

          invalid_status=$(curl -sS -o /tmp/mt4-invalid.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{bad' "$SBT_URL/api/v1/mt4/bitey-report")
          [[ "$invalid_status" == "400" ]]
          echo 'Worker deployment and MT4 proxy smoke tests passed.'
