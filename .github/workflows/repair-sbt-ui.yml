name: Repair SBT UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore rich UI from known-good commit
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'class="app"' web/index.html && grep -q 'Trading Laboratory' web/index.html && grep -q 'Market Intelligence' web/index.html; then
            echo 'Rich SBT UI already present.'
            exit 0
          fi
          git show 33b3617c40b5c95d0036a99ce705853010fc5e68:web/index.html > web/index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('web/index.html')
          s = p.read_text(encoding='utf-8')
          loader = '<script src="/runtime.js?v=20260912" defer></script>\n'
          legacy = '<script src="/runtime.js" defer></script>\n'
          if legacy in s:
              s = s.replace(legacy, loader, 1)
          elif '/runtime.js?v=20260912' not in s:
              s = s.replace('</body>', loader + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repaired UI
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/index.html; then
            echo 'No UI repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html
          git commit -m 'chore: restore SBT UI'
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy SBT Worker
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test deployed Worker
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsSL --retry 5 --retry-delay 3 "https://bitey-system-bots-trading.raylerr481.workers.dev/?probe=${GITHUB_SHA}")
          printf '%s' "$body" | grep -q 'Bitey SBT'
          printf '%s' "$body" | grep -q 'Trading Laboratory'
          health=$(curl -fsSL --retry 5 --retry-delay 3 "https://bitey-system-bots-trading.raylerr481.workers.dev/health?probe=${GITHUB_SHA}")
          printf '%s' "$health" | grep -q '"live":false'
          printf '%s' "$health" | grep -q '"real_money":false'
          printf '%s' "$health" | grep -q '"broker_orders":0'
          printf '%s' "$health" | grep -q '"web_build":"f6-canonical-terminal"'
