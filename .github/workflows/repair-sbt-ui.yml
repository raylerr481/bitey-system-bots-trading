name: Repair SBT UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore rich UI from known-good commit
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'class="app"' web/index.html && grep -q 'Trading Laboratory' web/index.html && grep -q 'Market Intelligence' web/index.html; then
            echo 'Rich SBT UI already present.'
            exit 0
          fi
          git show 33b3617c40b5c95d0036a99ce705853010fc5e68:web/index.html > web/index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('web/index.html')
          s = p.read_text(encoding='utf-8')
          loader = '<script src="/runtime.js?v=20260915" defer></script>\n'
          versions = [
              '<script src="/runtime.js" defer></script>\n',
              '<script src="/runtime.js?v=20260910" defer></script>\n',
              '<script src="/runtime.js?v=20260911" defer></script>\n',
              '<script src="/runtime.js?v=20260912" defer></script>\n',
              '<script src="/runtime.js?v=20260915" defer></script>\n',
          ]
          for old in versions[:-1]:
              if old in s:
                  s = s.replace(old, loader, 1)
                  break
          if '/runtime.js?v=20260915' not in s:
              s = s.replace('</body>', loader + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repaired UI
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/index.html; then
            echo 'No UI repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html
          git commit -m 'chore: restore SBT UI'
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy SBT Worker
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test deployed Worker
        shell: bash
        run: |
          set -euo pipefail
          SBT_URL='https://bitey-system-bots-trading.raylerr481.workers.dev'
          body=$(curl -fsSL --retry 5 --retry-delay 3 "$SBT_URL/?probe=${GITHUB_SHA}")
          printf '%s' "$body" | grep -q 'Bitey SBT'
          printf '%s' "$body" | grep -q 'Trading Laboratory'
          printf '%s' "$body" | grep -q 'Market Intelligence'
          health=$(curl -fsSL --retry 5 --retry-delay 3 "$SBT_URL/health?probe=${GITHUB_SHA}")
          printf '%s' "$health" | grep -q '"live":false'
          printf '%s' "$health" | grep -q '"real_money":false'
          printf '%s' "$health" | grep -q '"broker_orders":0'
          printf '%s' "$health" | grep -q '"web_build":"'
          candles=$(curl -fsSL --retry 5 --retry-delay 3 "$SBT_URL/api/v1/market/candles/EURUSD?timeframe=M5&limit=200&probe=${GITHUB_SHA}")
          CANDLES="$candles" python - <<'PY'
          import json, os, sys
          payload = json.loads(os.environ['CANDLES'])
          candles = payload.get('candles') or []
          if payload.get('ok') is not True or len(candles) < 20:
              print('Market candle smoke test failed:', json.dumps(payload)[:2000])
              sys.exit(1)
          required = ('time', 'open', 'high', 'low', 'close')
          if not all(all(k in c for k in required) for c in candles[:20]):
              print('Market candle contract failed: missing OHLC fields')
              sys.exit(1)
          if payload.get('execution_enabled') is not False:
              print('Safety contract failed: execution_enabled must be false')
              sys.exit(1)
          print(f'Market candle smoke test OK: {len(candles)} EURUSD M5 candles')
          PY
          bot=$(curl -fsSL --retry 5 --retry-delay 3 "$SBT_URL/bot-lab.html?probe=${GITHUB_SHA}")
          printf '%s' "$bot" | grep -q 'id="mtChart"'
          printf '%s' "$bot" | grep -q 'id="mtChartEmpty"'
          printf '%s' "$bot" | grep -q 'class="chart-wrap"'
          printf '%s' "$bot" | grep -q 'min-height:500px'
          trader=$(curl -fsSL --retry 5 --retry-delay 3 "$SBT_URL/web-trader.js?probe=${GITHUB_SHA}")
          printf '%s' "$trader" | grep -q 'api/v1/market/candles/'
          printf '%s' "$trader" | grep -q 'requestAnimationFrame(() => drawChart())'
          printf '%s' "$trader" | grep -q 'execution_enabled:false'
          echo 'SBT deployed market-feed and chart contract smoke tests OK.'