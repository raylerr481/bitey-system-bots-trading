name: Audit integrity tests
on:
  push:
    branches:
      - experimental/30-evaluators-two-assemblies-csv-audit
  pull_request:
    branches:
      - experimental/30-evaluators-two-assemblies-csv-audit
jobs:
  audit-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run audit CSV and EA contract regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
