name: Audit integrity tests
on:
  push:
    branches:
      - experimental/30-evaluators-two-assemblies-csv-audit
  pull_request:
    branches:
      - experimental/30-evaluators-two-assemblies-csv-audit
jobs:
  audit-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run audit CSV regression tests
        run: python tests/test_audit_integrity_check.py -v
      - name: Run EA audit contract tests
        run: python tests/test_ea_audit_contract.py -v
