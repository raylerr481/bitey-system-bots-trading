services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: bitey-sbt-freqtrade
    restart: "no"
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --config /freqtrade/user_data/config.dryrun.json
      --strategy BiteyBaselineV1
